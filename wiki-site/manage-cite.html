<body><main><nav><a href="index.html">Wiki 索引</a> · <a href="sources.html">原始資料</a> · <a href="log.html">紀錄</a> · <a href="../slides/index.html">教學簡報</a> · <a href="../docs/loop.html">流程設計</a></nav><h1>記錄搜尋、書目管理與引用</h1>
<ul>
<li>每一次搜尋策略都記下來（資料庫、查詢式、日期、筆數），之後才能重現。<a class="cite" href="sources.html#S4">[S4]</a></li>
<li>用書目管理工具整理結果。<a class="cite" href="sources.html#S4">[S4]</a></li>
<li>Google Scholar 的 Cite 可匯出 BibTeX、EndNote 等格式。<a class="cite" href="sources.html#S2">[S2]</a></li>
<li>NDLTD 用 RIS 匯入 Zotero 較完整；引用時用永久網址。<a class="cite" href="sources.html#S8">[S8]</a></li>
<li>建議的紀錄欄位：日期｜資料庫｜查詢式｜篩選條件｜筆數｜留下幾篇。[整理]</li>
</ul></main></body></html>
